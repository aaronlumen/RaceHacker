# Tuned for a memory-constrained (15 GB) machine: keep the whole build in a
# single, modest JVM so native memory isn't exhausted (was causing JVM hs_err
# crashes). Heap kept moderate; one worker; Kotlin compiled in-process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
